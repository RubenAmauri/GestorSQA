[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
# E/W: estilo PEP 8 · F: errores · I: orden de imports · B: errores probables · UP: sintaxis moderna · DJ: buenas prácticas de Django
select = ["E", "W", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--strict-markers"
# WhiteNoise avisa que no existe staticfiles/ porque en pruebas no se ejecuta collectstatic.
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "config/wsgi.py", "config/asgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", "apps/accounts/migrations"]
