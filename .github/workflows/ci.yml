# Integración continua del Gestor SQA (SQAP 5.1.2 c).
# Corre en cada pull request (también en los que van encima de otro PR) y en cada push
# a main. La protección de main exige que estos tres trabajos pasen antes del merge.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:11.4
        env:
          # Contraseña generada en cada ejecución; no queda escrita en el repositorio (SQAP 7.1.2).
          MARIADB_ROOT_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          MARIADB_DATABASE: gestorsqa
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DJANGO_DEBUG: "1"
      DB_ENGINE: mysql
      DB_NAME: gestorsqa
      DB_USER: root
      DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Dependencias del sistema (cliente de MariaDB)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libmysqlclient-dev
      - name: Dependencias de Python
        run: pip install -r requirements-dev.txt
      - name: Estilo y análisis estático (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Análisis de seguridad (Bandit, severidad alta)
        run: bandit -r . -c pyproject.toml -lll
      - name: Complejidad ciclomática ≤ 10 (radon)
        run: |
          resultado=$(radon cc apps config -n C -s)
          if [ -n "$resultado" ]; then
            echo "Funciones con complejidad mayor a 10:"
            echo "$resultado"
            exit 1
          fi
          echo "Todas las funciones tienen complejidad ≤ 10."
      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run
      - name: Pruebas con cobertura ≥ 75 %
        run: pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=75
      - name: Cobertura ≥ 90 % en partes de riesgo alto (motor de salud y core)
        run: |
          coverage report --fail-under=90 \
            --include="apps/reports/salud.py,apps/reports/umbrales.py,apps/core/*"
      - name: PR-RNF05-03 · Configuración segura de despliegue
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-${{ github.run_id }}-${{ github.sha }}
        run: python manage.py check --deploy --fail-level WARNING
      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Análisis estático (ESLint)
        run: npm run lint
      - name: Pruebas (Vitest)
        run: npm test
      - name: Compilación
        run: npm run build

  imagen:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen de producción
        run: docker build -t gestor-sqa:ci .
      - name: Validar el compose de producción
        run: cp .env.example .env && docker compose -f compose.yml config --quiet
